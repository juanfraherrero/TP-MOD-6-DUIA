services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://duia:duia@db:5432/duia
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=duia
      - POSTGRES_PASSWORD=duia
      - POSTGRES_DB=duia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duia -d duia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
